name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # rebuild every 6h to refresh GitHub + Spotify snapshot data

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write # to flag an expired Spotify token

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Refresh GitHub stats for allowlisted repos; falls back to the committed cache on failure.
      - name: Fetch GitHub data
        run: npm run fetch:github
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # music.json isn't committed, so carry the last good copy between runs: if Spotify is
      # unreachable this run, the card shows the previous snapshot instead of disappearing.
      - name: Restore last music snapshot
        uses: actions/cache/restore@v6
        with:
          path: src/data/music.json
          key: music-${{ github.run_id }}
          restore-keys: music-
      # Listening snapshot for the Now section (live "now playing" comes from the Worker).
      # The script exits non-zero ONLY when the refresh token has expired.
      - name: Fetch Spotify data
        id: spotify
        run: npm run fetch:spotify
        continue-on-error: true
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      # Opening an issue emails the owner; skip if one is already open.
      - name: Flag expired Spotify token
        if: steps.spotify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Spotify token expired: run npm run spotify:auth -- --push"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "Spotify's refresh token expired (they last 6 months). The music card is showing its last snapshot and the live Now playing has stopped. From the repo root, run \`npm run spotify:auth -- --push\` and log in; that updates both GitHub and the Cloudflare Worker. Close this issue afterwards."
          fi
      - name: Save music snapshot
        if: hashFiles('src/data/music.json') != ''
        uses: actions/cache/save@v6
        with:
          path: src/data/music.json
          key: music-${{ github.run_id }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables cron workflows after 60 days without repo activity. Re-enabling via the API
  # on each scheduled run resets that clock, so the 6-hourly refresh never silently stops.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
